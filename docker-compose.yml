name: Litrizz-V7
services:
  bot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: Litrizz-V7:latest
    container_name: Litrizz-V7
    init: true
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DATA_DIR: /data
      PAIRING_MODE: ${PAIRING_MODE:-code}
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    stop_grace_period: 25s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
